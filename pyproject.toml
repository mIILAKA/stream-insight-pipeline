[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-insight-pipeline"
version = "0.1.0"
description = "A reproducible analytics pipeline built from synthetic livestream data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mIILAKA" }]
dependencies = [
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.9,<2",
  "duckdb>=1.4,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stream_insight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: exercises DuckDB and dbt together",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
