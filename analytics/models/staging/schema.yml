version: 2

models:
  - name: stg_channels
    description: Clean channel dimensions from fictional source data.
    columns:
      - name: channel_id
        data_tests: [unique, not_null]
      - name: channel_name
        data_tests: [not_null]
      - name: language
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [en, id, ja, multi]

  - name: stg_streams
    description: One record per synthetic livestream.
    columns:
      - name: stream_id
        data_tests: [unique, not_null]
      - name: channel_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_channels')
                field: channel_id
      - name: started_at
        data_tests: [not_null]
      - name: duration_sec
        data_tests: [not_null]
      - name: synthetic_source
        data_tests:
          - accepted_values:
              arguments:
                values: [generated]

  - name: stg_chat_events
    description: Synthetic chat and reaction events.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: stream_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_streams')
                field: stream_id
      - name: occurred_at
        data_tests: [not_null]
      - name: reaction_score
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [message, reaction, membership]

  - name: stg_clip_candidates
    description: Candidate clip intervals proposed for each synthetic stream.
    columns:
      - name: candidate_id
        data_tests: [unique, not_null]
      - name: stream_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_streams')
                field: stream_id
      - name: start_sec
        data_tests: [not_null]
      - name: end_sec
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [new, reviewed, approved, rejected]
